<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gelybo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#a9c9b6;
  --panel:rgba(244,251,246,.62);
  --panel-line:rgba(255,255,255,.75);
  --ink:#1d3a2b;
  --ink-soft:#466b56;
  --shadow:rgba(18,44,30,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a26;
    --panel:rgba(16,30,26,.58);
    --panel-line:rgba(190,230,210,.22);
    --ink:#e4f3ea;
    --ink-soft:#a6c9b4;
    --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a26;
  --panel:rgba(16,30,26,.58);
  --panel-line:rgba(190,230,210,.22);
  --ink:#e4f3ea;
  --ink-soft:#a6c9b4;
  --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

.tag{
  position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
  max-width:min(70vw,340px);
  padding:8px 16px 9px;border-radius:22px;
  background:var(--panel);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 6px 18px var(--shadow);
}
.tag h1{margin:0;font-size:24px;line-height:1.05;font-weight:800;letter-spacing:.2px}
.tag p{margin:2px 0 0;font-size:14px;line-height:1.3;color:var(--ink-soft);font-weight:600}
.tag .sign{font-size:13px;margin-top:0}
.tag .sign[hidden]{display:none}

.sky{
  position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--ink);
  background:var(--panel);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 18px var(--shadow);
}
.sky svg{width:24px;height:24px}
.sky.q{top:calc(env(safe-area-inset-top,0px) + 70px);font:800 13px/1 "Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;letter-spacing:.3px}
.sky:focus-visible,.drop:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}

.hint{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);
  padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
  background:var(--panel);border:1px solid var(--panel-line);color:var(--ink);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .8s ease;pointer-events:none;
}
.hint.off{opacity:0}

.tray{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(calc(100% - 20px),720px);
  padding:10px 6px 6px;border-radius:30px;
  background:var(--panel);border:1px solid var(--panel-line);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 10px 30px var(--shadow);
}
.drops{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 6px 2px;
  justify-content:safe center;scroll-snap-type:x proximity;
}
.drops::-webkit-scrollbar{display:none}
/* Máy tính dùng chuột: xếp các nút xuống dòng thay vì phải lăn ngang */
@media (hover:hover) and (pointer:fine){
  .drops{flex-wrap:wrap;justify-content:center;overflow:visible;row-gap:8px}
}
.tabs{display:flex;justify-content:safe center;gap:4px;padding:0 8px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.he{flex:0 0 auto;white-space:nowrap}
.he{--hc:#fff;display:inline-flex;align-items:center;gap:6px;padding:3px 12px 4px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-soft);font:700 15px/1.2 "Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.he i{width:9px;height:9px;border-radius:50%;background:var(--hc);box-shadow:0 0 0 1px rgba(60,80,100,.22),0 0 6px var(--hc)}
.he[aria-selected="true"]{color:var(--ink);background:color-mix(in srgb,var(--hc) 22%,transparent);border-color:color-mix(in srgb,var(--hc) 70%,transparent)}
.he:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;width:72px;scroll-snap-align:center}
.drop{
  --c:#ffffff;
  width:56px;height:56px;border-radius:50%;padding:0;cursor:pointer;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.0) 18%),
    radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 28%,transparent),rgba(255,255,255,.18) 70%);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 -6px 12px rgba(255,255,255,.35),inset 0 2px 4px rgba(255,255,255,.5),0 4px 10px var(--shadow);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .3s ease;
}
.drop svg{width:30px;height:30px;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c) 70%,transparent))}
.drop[aria-pressed="true"]{
  transform:translateY(-4px) scale(1.06);
  box-shadow:inset 0 -6px 12px rgba(255,255,255,.35),0 0 0 2px var(--c),0 0 22px var(--c),0 6px 14px var(--shadow);
}
.slot span{font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.1}
.slot .drop[aria-pressed="true"] + span{color:var(--ink)}

@media (max-width:420px){
  .tag h1{font-size:21px}
  .tag p{font-size:13px}
  .slot{width:62px}
  .he{padding:3px 9px 4px;font-size:14px;gap:5px}
  .drop{width:50px;height:50px}
  .drop svg{width:26px;height:26px}
  .hint{font-size:13px;top:calc(env(safe-area-inset-top,0px) + 86px)}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Tổ của Gelybo, kéo để xoay, chạm để chọc Gelybo"></canvas>

<header class="tag">
  <h1>Gelybo</h1>
  <p id="mood">Bụng đang trống, chọn một lõi cho bé nhé</p>
  <p id="sign" class="sign" hidden></p>
</header>

<button class="sky" id="sky" aria-label="Chuyển sang ban đêm"></button>
<button class="sky q" id="hq" aria-label="Đang ở đồ hoạ cao, chạm để chuyển sang chế độ nhẹ">HD</button>

<div class="hint" id="hint">Kéo để xoay, chạm mặt trăng để Gelybo lăn tới</div>

<nav class="tray" aria-label="Thư viện lõi">
  <div class="tabs" id="tabs" role="tablist" aria-label="Ngũ hành"></div>
  <div class="drops" id="drops"></div>
</nav>

  const zn=ZONES[k],a=Math.atan2(zn.z,zn.x),ex=zn.x-Math.cos(a)*(k==='home'?1.6:k==='grotto'?1.2:k==='north'?.2:.3),ez=zn.z-Math.sin(a)*(k==='home'?1.6:k==='grotto'?1.2:k==='north'?.2:.3);

});
const PLAZAS=[{x:0,z:0,r:1.75},{x:ZONES.bells.x,z:ZONES.bells.z,r:1.55},{x:ZONES.north.x,z:ZONES.north.z,r:1.6},{x:-3.4,z:-2.4,r:.9}];
function pathDist(x,z){
  let d=Math.abs(Math.hypot(x,z)-RING);
  for(const sp of SPOKES){const P=sp.pts;for(let i=0;i<P.length-1;i++){
    const ax=P[i].x,az=P[i].z,bx=P[i+1].x-ax,bz=P[i+1].z-az,l=bx*bx+bz*bz;

const SMALL=[];

  if(CRATERS.some(c=>Math.hypot(x-c.x,z-c.z)<c.r+cr+.3))continue;

const SOLIDS=[{x:0,z:0,r:1.08},{x:ZONES.home.x,z:ZONES.home.z,r:1.52}];
function collide(p,v){
  for(const s of SOLIDS){const dx=p.x-s.x,dz=p.y-s.z,d=Math.hypot(dx,dz),m=s.r+BR*.92;
    if(d<m&&d>1e-4){const nx=dx/d,nz=dz/d;p.x=s.x+nx*m;p.y=s.z+nz*m;const vn=v.x*nx+v.y*nz;if(vn<0){v.x-=1.4*vn*nx;v.y-=1.4*vn*nz;}}}
  {const dx=p.x-GROT.x,dz=p.y-GROT.z,d=Math.hypot(dx,dz),ang=Math.atan2(dz,dx);
   const inOpen=Math.abs(Math.atan2(Math.sin(ang-GROT.open),Math.cos(ang-GROT.open)))<GROT.gap/2-.15;
   if(!inOpen&&d>GROT.r-BR-.12&&d<GROT.r+BR&&d>1e-4){const nx=dx/d,nz=dz/d,out=d>GROT.r-.06,t=out?GROT.r+BR:GROT.r-BR-.12;p.x=GROT.x+nx*t;p.y=GROT.z+nz*t;const vn=v.x*nx+v.y*nz;if((out&&vn<0)||(!out&&vn>0)){v.x-=1.4*vn*nx;v.y-=1.4*vn*nz;}}}
  const r=Math.hypot(p.x,p.y),lim=R-1.0;if(r>lim){p.multiplyScalar(lim/r);const nx=p.x/lim,nz=p.y/lim,vn=v.x*nx+v.y*nz;if(vn>0){v.x-=1.4*vn*nx;v.y-=1.4*vn*nz;}}
}

function headGeo(){
  const g=new T.SphereGeometry(1,112,72),p=g.attributes.position,v=new T.Vector3();
  const a=.53,b=HH,c=.31,q=2.4;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const hxy=Math.pow(Math.pow(Math.abs(v.x/a),q)+Math.pow(Math.abs(v.y/b),q),1/q);
    const F=Math.sqrt(hxy*hxy+(v.z/c)*(v.z/c))||1;
    p.setXYZ(i,v.x/F,v.y/F,v.z/F);
  }
  g.computeVertexNormals();smoothNormals(g);return g;
}

function onSurface(lx,ly){
  const o=head.localToWorld(new T.Vector3(lx,ly,3));
  ray.set(o,new T.Vector3(0,0,-1));
  const h=ray.intersectObject(head,false)[0];
  const pt=inner.worldToLocal(h.point.clone());
  const nm=h.face.normal.clone().transformDirection(head.matrixWorld).normalize();
  return {pt,nm};
}

function eyeGeo(kind,t,side){
  const w=[0,.018,.036][t];
  if(kind==='open'){const g=new T.SphereGeometry(1,24,16);g.scale(.066+w,.1+w,.024);return [g];}
  if(kind==='half'){const g=new T.SphereGeometry(1,24,16);g.scale(.08+w,.042+w,.024);return [g];}
  if(kind==='happy'||kind==='sleepy'){const g=new T.TorusGeometry(.086,.017+w,10,32,Math.PI);g.scale(1,1,.45);if(kind==='sleepy'){g.rotateZ(Math.PI);g.translate(0,.03,0);}else g.translate(0,-.035,0);return [g];}
  if(kind==='squeeze')return [1,-1].map(k=>{const c=new T.CapsuleGeometry(.017+w,.1,4,10);c.scale(1,1,.45);c.rotateZ(Math.PI/2+k*side*.5);c.translate(0,k*.03,0);return c;});
  if(kind==='star')return [eyeFlat(eyeStar(),.13+w*1.3)];
  if(kind==='heart')return [eyeFlat(eyeHeart(),.115+w*1.3)];
  return [];
}

  fragmentShader:`uniform float uTime;uniform vec3 uColor;uniform float uInt;varying vec2 vUv;
float caus(vec2 uv,float t){vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.,inten=.005;
 for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
 c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}

void main(){vec2 q=vUv-.5;float r=length(q)*2.;float m=smoothstep(1.,.25,r);

    const t=tris[lo];let u=rnd(),w=rnd();if(u+w>1){u=1-u;w=1-w;}
    v.copy(t.a).addScaledVector(_ab.subVectors(t.b,t.a),u).addScaledVector(_ac.subVectors(t.c,t.a),w);
    const ix=Math.floor(v.x/md),iy=Math.floor(v.y/md),iz=Math.floor(v.z/md);let ok=true;
    for(let dx=-1;dx<=1&&ok;dx++)for(let dy=-1;dy<=1&&ok;dy++)for(let dz=-1;dz<=1&&ok;dz++){const cl=grid.get(K(ix+dx,iy+dy,iz+dz));if(cl)for(const q of cl){if(v.distanceToSquared(q)<md2){ok=false;break;}}}
    if(!ok)continue;
    const q=v.clone(),key=K(ix,iy,iz);(grid.get(key)||grid.set(key,[]).get(key)).push(q);keepP.push(q);keepN.push(t.n);
  }
  const pos=new Float32Array(keepP.length*3),nor=new Float32Array(keepP.length*3);
  keepP.forEach((q,i)=>{pos[i*3]=q.x;pos[i*3+1]=q.y;pos[i*3+2]=q.z;const n=keepN[i];nor[i*3]=n.x;nor[i*3+1]=n.y;nor[i*3+2]=n.z;});

let persona=EMPTY,current=null,leaving=[],flying=null;

function setFace(eyesMode,mouthMode,blush){
  eyes.forEach((e,i)=>{
    let m=eyesMode;if(m==='wink')m=i===1?'happy':'open';
    Object.keys(e.shapes).forEach(k=>e.shapes[k].visible=k===m);
    e.mode=m;
  });
  mouth.smile.visible=mouthMode==='smile';mouth.open.visible=mouthMode==='open';mouth.o.visible=mouthMode==='o';
  blushMat.opacity=blush;
}

function moodText(p){const h=HE.find(x=>x.id===p.he);return p.id?`Lõi ${p.name} hệ ${h.name}, ${p.mood}`:'Bụng đang trống, chọn một lõi cho bé nhé';}

function setCore(id,anim){
  const def=CORES.find(c=>c.id===id)||EMPTY;
  if(def===persona&&current)return;
  if(current){leaving.push({obj:current,t:0});current=null;}
  if(flying){coreAnchor.remove(flying.obj);flying=null;}
  persona=def;
  colFrom.copy(colCur);colTo.set(def.color);colT=0;
  if(def.id){
    const obj=new T.Group();obj.add(buildCore(def.id,def.color));obj.children[0].scale.multiplyScalar(.88);
    if(def.glow)obj.traverse(o=>{if(o.material&&o.material.emissiveIntensity!==undefined)o.material.emissiveIntensity*=def.glow;});
    // Lớp sáng cộng màu vẽ đè lên lõi: giữ được hình lõi bị khúc xạ trong gel mà vẫn rực, có quầng
    const meshes=[];obj.traverse(o=>{if(o.isMesh)meshes.push(o);});
    meshes.forEach(m=>{const c=(m.material.emissive||m.material.color).clone();
      const ov=new T.Mesh(m.geometry,new T.MeshBasicMaterial({color:c,blending:T.AdditiveBlending,transparent:true,opacity:.5*(def.glow||1),depthTest:false,depthWrite:false,toneMapped:false}));
      ov.renderOrder=5;m.add(ov);});
    coreAnchor.add(obj);current=obj;
    if(anim){
      const fwd=new T.Vector3();camera.getWorldDirection(fwd);
      const up=new T.Vector3(0,1,0).applyQuaternion(camera.quaternion);
      const start=camera.position.clone().addScaledVector(fwd,2.6).addScaledVector(up,-1.1);
      BE.updateMatrixWorld(true);
      const from=coreAnchor.worldToLocal(start);
      flying={obj,from,t:0,dur:.95};obj.position.copy(from);obj.scale.setScalar(.5);
    }
  }
  setFace(def.eyes,def.mouth,def.blush);
  document.getElementById('mood').textContent=moodText(def);
  if(def.he&&def.he!==curHe)showHe(def.he);
  document.querySelectorAll('.drop[data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===def.id?'true':'false'));
  try{localStorage.setItem('begiot.core',def.id);}catch(e){}
}

const pointers=new Map();let pinch0=0,rad0=0;
const hint=document.getElementById('hint');let hintOff=false;
function hideHint(){if(!hintOff){hintOff=true;hint.classList.add('off');}}
setTimeout(hideHint,6000);
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()});
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);rad0=radius;}
});
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===1){vT=-dx*.0075;vP=-dy*.0055;theta+=vT;phi=clamp(phi+vP,.6,1.48);if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8)hideHint();}
  else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);radius=clamp(rad0*pinch0/Math.max(d,1),baseRadius*.6,baseRadius*1.45);}
});
function endPointer(e){
  const p=pointers.get(e.pointerId);if(!p)return;pointers.delete(e.pointerId);
  if(pointers.size===0&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8&&performance.now()-p.t<400)tap(e.clientX,e.clientY);
}

  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects([head,body],false)[0];
  hideHint();
  if(!hit){
    const gh=ray.intersectObject(hubMesh,false)[0];
    if(gh){const r=Math.hypot(gh.point.x,gh.point.z),k=r>R-1.1?(R-1.1)/r:1;mv.target=new T.Vector2(gh.point.x*k,gh.point.z*k);}
    return;
  }
  if(hit.object===head){hv.y+=2.6;faceOverrideUntil=clockT+.9;setFace(persona.id==='sao'?'star':persona.id==='tim'?'heart':'squeeze','open',0);}
  else{tapT=0;tapA=.18;wigT=0;}
  for(let i=0;i<3;i++)spawn(heartTex,hit.point.clone().add(new T.Vector3((rnd()-.5)*.5,.2+rnd()*.2,(rnd()-.5)*.3)),.22,1.3+i*.15,new T.Vector3((rnd()-.5)*.25,.7,0));
}

  const b=document.createElement('button');b.className='he';b.setAttribute('role','tab');b.dataset.he=h.id;
  b.style.setProperty('--hc',h.color);b.innerHTML=`<i aria-hidden="true"></i>${h.name}`;
  b.addEventListener('click',()=>{hideHint();showHe(h.id);});tabsEl.appendChild(b);
});
{const b=document.createElement('button');b.className='he';b.setAttribute('role','tab');b.dataset.he='z';
  b.style.setProperty('--hc','#c29bff');b.innerHTML='<i aria-hidden="true"></i>Hoàng đạo';
  b.addEventListener('click',()=>{hideHint();showHe('z');});tabsEl.appendChild(b);}
function showHe(he){
  curHe=he;
  tabsEl.querySelectorAll('.he').forEach(b=>b.setAttribute('aria-selected',b.dataset.he===he?'true':'false'));
  dropsEl.innerHTML='';
  if(he==='z'){
    [{id:'',name:'Không'},...SIGNS].forEach(sg=>{
      const slot=document.createElement('div');slot.className='slot';
      const b=document.createElement('button');b.className='drop';b.dataset.sign=sg.id;b.style.setProperty('--c',sg.id?sg.color:'#cfe0d6');
      b.setAttribute('aria-pressed',sg.id===curSign?'true':'false');b.setAttribute('aria-label',sg.id?`Phụ kiện ${sg.name}`:'Bỏ phụ kiện');
      b.innerHTML=`<svg viewBox="0 0 32 32" aria-hidden="true" style="color:var(--ink-soft)">${sg.id?ACC_ICONS[sg.id]:ICONS['']}</svg>`;
      b.addEventListener('click',()=>{hideHint();setSign(sg.id,true);});
      const l=document.createElement('span');l.textContent=sg.name;
      slot.append(b,l);dropsEl.appendChild(slot);
    });
    dropsEl.scrollLeft=0;return;
  }
  [EMPTY,...CORES.filter(c=>c.he===he)].forEach(c=>{
    const slot=document.createElement('div');slot.className='slot';
    const b=document.createElement('button');b.className='drop';b.dataset.id=c.id;b.style.setProperty('--c',c.id?c.color:'#cfe0d6');
    b.setAttribute('aria-pressed',c.id===persona.id?'true':'false');b.setAttribute('aria-label',c.id?`Lõi ${c.name}`:'Bỏ lõi ra');
    b.innerHTML=`<svg viewBox="0 0 32 32" aria-hidden="true" style="color:var(--ink-soft)">${ICONS[c.id]}</svg>`;
    b.addEventListener('click',()=>{hideHint();setCore(c.id,true);});
    const l=document.createElement('span');l.textContent=c.id?c.name:'Trống';
    slot.append(b,l);dropsEl.appendChild(slot);
  });
}
showHe('kim');

/* ---------- Vòng lặp ---------- */
const clock=new T.Clock();let clockT=0,nextBlink=2,blinkT=-1,zNext=0;
const o3=new T.Object3D(),tmpV=new T.Vector3();
const mv={pos:new T.Vector2(0,RING),vel:new T.Vector2(),target:null,nextWander:7,yaw:0,still:0};
const hp=new T.Vector3(0,2*BR+GAP+HH,0),hv=new T.Vector3(),hT=new T.Vector3(),mvD=new T.Vector2();
const rollAxis=new T.Vector3(),rollQ=new T.Quaternion();
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
let saved=null;try{saved=localStorage.getItem('begiot.core');}catch(e){}
updateCam();setCore(saved===null?'sao':saved,false);
let savedSign='';try{savedSign=localStorage.getItem('begiot.sign')||'';}catch(e){}
setSign(savedSign,false);

function frame(){
  const dt=Math.min(clock.getDelta(),.05);clockT+=dt;const t=clockT;
  // camera quán tính
  if(pointers.size===0){theta+=vT;phi=clamp(phi+vP,.6,1.48);vT*=.92;vP*=.85;}
  updateCam();
  nightK=lerp(nightK,night?1:0,1-Math.exp(-dt*2.5));applySky();

  // màu lõi
  if(colT<1){colT=Math.min(1,colT+dt/.8);colCur.copy(colFrom).lerp(colTo,ease(colT));}
  const P=persona,hasCore=!!P.id;
  coreLight.color.copy(colCur);
  glowK+=((P.glow||1)-glowK)*Math.min(1,dt*3);
  coreLight.intensity=(hasCore?lerp(DAY.core,NIGHT.core,nightK)*glowK:.5)*(1+Math.sin(t*2.2)*.08);
  glowMat.color.copy(colCur);
  glowMat.opacity=(hasCore?lerp(DAY.glow,NIGHT.glow,nightK)*glowK:.22)*(1+Math.sin(t*2.2)*.1)*(flying?.4+.6*flying.t/flying.dur:1);
  sparkMat.emissive.copy(colCur);sparkMat.color.copy(colCur);
  glass.attenuationColor.copy(white).lerp(colCur,hasCore?.32:.08);
  glass.emissive.copy(colCur).multiplyScalar(hasCore?lerp(.05,.12,nightK)*glowK:.02);
  sparks.visible=hasCore;

  // di chuyển: tự lang thang hoặc lăn tới chỗ được chạm
  if(!mv.target&&t>mv.nextWander&&!flying){mv.target=pickWander();}
  if(mv.target){
    mvD.copy(mv.target).sub(mv.pos);const dist=mvD.length();
    if(dist<.12){mv.target=null;mv.nextWander=t+(7+rnd()*9)*(P.zzz?3:P.hop?.6:1);}
    else{const sp=Math.min(1.25*(P.hop?1.25:P.zzz?.6:1),dist*1.6);mvD.normalize().multiplyScalar(sp);mv.vel.lerp(mvD,1-Math.exp(-dt*3.5));}
  }else mv.vel.multiplyScalar(Math.exp(-dt*.7));
  {const e=.08,px=mv.pos.x,pz=mv.pos.y,gx=(islandH(px+e,pz)-islandH(px-e,pz))/(2*e),gz=(islandH(px,pz+e)-islandH(px,pz-e))/(2*e);mv.vel.x-=gx*7*dt;mv.vel.y-=gz*7*dt;}
  mv.pos.addScaledVector(mv.vel,dt);collide(mv.pos,mv.vel);
  const speed=mv.vel.length();
  BE.position.set(mv.pos.x,islandH(mv.pos.x,mv.pos.y),mv.pos.y);
  if(speed>1e-4){rollAxis.set(mv.vel.y,0,-mv.vel.x).normalize();rollQ.setFromAxisAngle(rollAxis,speed*dt/BR);roll.quaternion.premultiply(rollQ);}

  // tính cách: thân nảy, đầu nghiêng
  let y=0,sy=1,rz=0,ry=0,rx=0,bz=0;
  sy+=Math.sin(t*(P.breathe||2.2))*.014*(P.breatheAmp||1)*RM;
  if(P.hop){const ph=(t*P.hop.speed)%Math.PI,h=Math.sin(ph);y+=h*h*P.hop.amp*RM;sy-=Math.pow(1-h,10)*.12*RM;}
  if(P.hover)y+=(.24+Math.sin(t*1.6)*.07)*RM;
  if(P.sway)rz+=Math.sin(t*.8)*.08*RM;
  if(P.tilt){rz+=Math.sin(t*.6)*.16*RM;ry+=Math.sin(t*.37)*.45*RM;}
  if(P.shy){ry+=Math.sin(t*1.3)*.35*RM;rz+=Math.sin(t*1.3+1)*.05*RM;}
  if(P.wiggle){const ph=t%2.6;if(ph<.9)bz+=Math.sin(ph*22)*.1*(1-ph/.9)*RM;}
  if(P.proud)rx-=.16+Math.sin(t*1.5)*.03;
  if(P.swing)rz+=Math.sin(t*3.2)*.12*RM;
  if(P.rock){bz+=Math.sin(t*2.4)*.07*RM;y+=Math.abs(Math.sin(t*2.4))*.04*RM;}
  if(P.spin){const ph=t%5.5;if(ph<1.4){const k=ease(ph/1.4);ry+=k*Math.PI*2;y+=Math.sin(k*Math.PI)*.2;}}
  if(speed>.05)y+=Math.abs(Math.sin(t*9))*.025*Math.min(speed,1);
  // chạm vào thân: rung kiểu thạch
  tapT+=dt;wigT+=dt;
  sy+=tapA*Math.exp(-5*tapT)*Math.sin(19*tapT);
  bz+=.12*Math.exp(-3.5*wigT)*Math.sin(26*wigT);
  const sxz=1/Math.sqrt(sy);
  squash.position.y=BR*sy+y;squash.scale.set(sxz,sy,sxz);squash.rotation.z=bz;
  const bodyTop=squash.position.y+BR*sy;

  // đầu: hướng mặt theo chiều lăn, đứng yên thì quay về phía người chơi
  if(speed>.08){mv.yaw+=wrapA(Math.atan2(mv.vel.x,mv.vel.y)-mv.yaw)*(1-Math.exp(-dt*5));mv.still=0;}
  else{mv.still+=dt;if(mv.still>.8){const ca=Math.atan2(camera.position.x-BE.position.x,camera.position.z-BE.position.z);mv.yaw+=wrapA(ca-mv.yaw)*(1-Math.exp(-dt*2.2));}}
  // đầu bám thân bằng lò xo: trễ nhịp khi lăn, nhún xuống khi thân nảy
  hT.set(BE.position.x,BE.position.y+bodyTop+GAP+HH,BE.position.z);
  for(let n=Math.ceil(dt/.012),i=0;i<n;i++){const h=dt/n;
    hv.x+=((hT.x-hp.x)*130-hv.x*13)*h;hv.z+=((hT.z-hp.z)*130-hv.z*13)*h;hv.y+=((hT.y-hp.y)*95-hv.y*10)*h;
    hp.addScaledVector(hv,h);}
  headG.position.set(hp.x-BE.position.x,hp.y-BE.position.y,hp.z-BE.position.z);
  const lagF=-(headG.position.x*Math.sin(mv.yaw)+headG.position.z*Math.cos(mv.yaw));
  const lagS=headG.position.x*Math.cos(mv.yaw)-headG.position.z*Math.sin(mv.yaw);
  headG.rotation.set(0,mv.yaw,0);inner.rotation.set(rx+lagF*2.2,ry,rz-lagS*2.2);
  // khe từ tính
  const hb=headG.position.y-HH,gl=Math.max(hb-bodyTop,.02);
  linkG.position.set(headG.position.x*.5,(bodyTop+hb)/2,headG.position.z*.5);
  linkBeam.scale.y=gl;const pl=1+Math.sin(t*3)*.05;
  linkDot.position.set(Math.sin(t*1.3)*.03,.05+Math.sin(t*2.1)*.012,-.07);linkDot2.position.set(-Math.sin(t*1.3)*.03,-.05-Math.sin(t*2.1)*.012,.07);linkRing.scale.set(pl,.62*pl,pl);
  linkMat.color.copy(colCur);beamMat.color.copy(colCur);linkMat.opacity=lerp(.6,.95,nightK)*glowK+.1;
  // bóng đổ và vũng sáng đi theo
  shadow.position.set(BE.position.x,BE.position.y+.015,BE.position.z);caustic.position.set(BE.position.x,BE.position.y+.022,BE.position.z);
  shadow.scale.setScalar(clamp(.62-y*.5,.35,.7));shadow.material.opacity=.42*clamp(1-y*1.2,.35,1);
  target.x+=(BE.position.x-target.x)*(1-Math.exp(-dt*1.5));target.z+=(BE.position.z-target.z)*(1-Math.exp(-dt*1.5));

  // mặt: chớp mắt
  if(faceOverrideUntil&&t>faceOverrideUntil){faceOverrideUntil=0;setFace(P.eyes,P.mouth,P.blush);}
  if(t>nextBlink&&blinkT<0){blinkT=0;nextBlink=t+2.5+rnd()*3;}
  let lid=1;if(blinkT>=0){blinkT+=dt;lid=Math.abs(Math.cos(Math.min(blinkT/.16,1)*Math.PI))*.9+.1;if(blinkT>.16)blinkT=-1;}
  const sleepyEye=eyes[0].mode==='sleepy';
  const br=(eyes[0].mode==='open'||eyes[0].mode==='half'?.35+.65*lid:1)*(sleepyEye?.8+.2*Math.sin(t*1.1):1);
  eyeCoreMat.color.setScalar(1.15*br);
  eyeRimMat.color.copy(colCur).multiplyScalar(1.25*br*(.55+.45*glowK));
  eyeTmp.set(0x14122a).lerp(eyeTmp.clone().copy(colCur).multiplyScalar(.3),.35);
  eyeOutMat.color.copy(eyeTmp);eyeOutMat.opacity=.3*(1-nightK);
  eyes.forEach(e=>{
    const sh=e.shapes[e.mode];if(sh)sh.scale.set(1,(e.mode==='open'||e.mode==='half')?.25+.75*lid:1,1);
    e.g.getWorldPosition(eyeP);eyeFw.set(0,0,1).transformDirection(e.g.matrixWorld);eyeCd.copy(camera.position).sub(eyeP).normalize();
    e.g.scale.setScalar(Math.max(smooth(-.55,-.1,eyeFw.dot(eyeCd)),.001));
  });

  // lõi: bay vào, bập bềnh
  if(flying){
    flying.t+=dt;const k=ease(Math.min(flying.t/flying.dur,1));
    const f=flying.from,mid=tmpV.copy(f).multiplyScalar(.5);mid.y+=.9;
    const a=1-k;flying.obj.position.set(a*a*f.x+2*a*k*mid.x,a*a*f.y+2*a*k*mid.y,a*a*f.z+2*a*k*mid.z);
    flying.obj.scale.setScalar(lerp(.5,1,k));flying.obj.rotation.y=(1-k)*Math.PI*3;
    if(flying.t>=flying.dur){flying.obj.position.set(0,0,0);flying=null;tapT=0;tapA=.12;}
  }else if(current){current.position.y=Math.sin(t*1.7)*.035;current.rotation.y=Math.sin(t*.9)*.45;}
  for(let i=leaving.length-1;i>=0;i--){const L=leaving[i];L.t+=dt;const k=Math.min(L.t/.45,1);L.obj.position.set(0,k*1.4,k*1.3);L.obj.scale.setScalar(1-ease(k));
    if(k>=1){coreAnchor.remove(L.obj);L.obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});leaving.splice(i,1);}}
  if(sparks.visible){sparkData.forEach((d,i)=>{const s=(.55+.45*Math.sin(t*3*d.s+d.ph))*1.0;o3.position.set(d.x,d.y+Math.sin(t*d.s+d.ph)*.04,d.z);o3.rotation.set(t*d.s,t*.7,0);o3.scale.setScalar(s);o3.updateMatrix();sparks.setMatrixAt(i,o3.matrix);});sparks.instanceMatrix.needsUpdate=true;}

  // phụ kiện: bật ra kiểu thạch rồi chạy hoạt ảnh riêng
  if(accPop<1){accPop=Math.min(1,accPop+dt/.55);const k=accPop;accHolder.scale.setScalar(k>=1?1:1-Math.exp(-6*k)*Math.cos(14*k));}
  GEL_U.uTime.value=t;GEL_U.uNight.value=nightK;
  DOT_U.uTime.value=t;renderer.getDrawingBufferSize(dotBuf);DOT_U.uScale.value=dotBuf.y/(2*Math.tan(camera.fov*Math.PI/360));
  causticMat.uniforms.uTime.value=t;causticMat.uniforms.uColor.value.copy(colCur);
  causticMat.uniforms.uInt.value=(hasCore?lerp(.75,1.0,nightK)*glowK:.15)*(flying?.3+.7*flying.t/flying.dur:1)*clamp(1-y*1.4,.25,1);
  caustic.scale.setScalar(clamp(.72-y*.4,.5,.75));
  if(bloom){bloom.strength=lerp(.55,.95,nightK);bloom.threshold=lerp(.78,.55,nightK);bloom.radius=.55;}
  if(accUpd)accUpd(t);

  // đảo: quả cầu thiên văn, chuông, pha lê, cực quang
  {const dA=Math.hypot(BE.position.x,BE.position.z),sp=1+2.5*(1-smooth(1.8,4,dA));
   armi.rings.forEach((r,i)=>{r.rotation.y+=dt*(.25+i*.15)*sp;r.rotation.z+=dt*.08*(i-1)*sp;});
   armi.orb.position.set(Math.cos(t*1.2*sp)*.9,1.5+Math.sin(t*.8)*.15,Math.sin(t*1.2*sp)*.9);
   armi.ball.material.emissiveIntensity=lerp(.9,1.6,nightK)+.6*(1-smooth(1.8,4,dA));}
  domeMat.emissiveIntensity=lerp(.5,1.6,nightK);
  auroraMat.uniforms.uTime.value=t;auroraMat.uniforms.uK.value=lerp(.55,1,nightK);
  bells.forEach(b=>{
    b.piv.getWorldPosition(b.wp);b.cool-=dt;
    const dxz=Math.hypot(b.wp.x-hp.x,b.wp.z-hp.z),dy=b.wp.y-.45-hp.y;
    if(b.cool<=0&&dxz<.55&&Math.abs(dy)<.8&&speed>.15){b.vel+=(rnd()<.5?-1:1)*(2.5+speed*1.5);b.flash=1;b.cool=.6;spawn(noteTex,b.wp.clone().add(new T.Vector3(0,-.2,0)),.3,1.4,new T.Vector3((rnd()-.5)*.4,.8,(rnd()-.5)*.4));}
    b.vel+=(-b.ang*28-b.vel*2.2)*dt;b.ang+=b.vel*dt;b.piv.rotation.x=b.ang;b.flash=Math.max(0,b.flash-dt*1.6);b.mat.emissiveIntensity=b.flash*1.4;
  });
  crystals.forEach(c=>{const d=Math.hypot(c.wp.x-BE.position.x,c.wp.z-BE.position.z),k=1-smooth(.5,2.6,d);c.m.emissiveIntensity=.12+k*(hasCore?2.6:1.2);c.m.emissive.copy(colCur).lerp(new T.Color('#b48cff'),.5);});

  // zzz khi ngủ
  if(P.zzz&&t>zNext){zNext=t+1.1;const zp=head.localToWorld(new T.Vector3(.35,.25,0));spawn(zTex,zp,.22,2.2,new T.Vector3(.18,.35,0));}

  // hiệu ứng bay lên
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.age+=dt;const k=f.age/f.life;f.s.position.addScaledVector(f.vel,dt);f.s.material.opacity=1-k*k;f.s.scale.setScalar(f.size*(.7+k*.6));if(k>=1){scene.remove(f.s);f.s.material.dispose();fx.splice(i,1);}}

  // bong bóng, đom đóm
  bubbles.forEach(b=>{const u=b.userData;u.y+=u.sp*dt*RM;if(u.y>6){u.y=.2;}const a=u.a+Math.sin(t*.2+u.ph)*.15;b.position.set(Math.cos(a)*u.d,u.y,Math.sin(a)*u.d+Math.sin(t*.5+u.ph)*.15);});
  ffData.forEach((d,i)=>{const a=d.a+t*.05*d.s*RM;ffPos[i*3]=Math.cos(a)*d.d+Math.sin(t*d.s+d.ph)*.3;ffPos[i*3+1]=d.y+Math.sin(t*d.s*1.3+d.ph)*.25;ffPos[i*3+2]=Math.sin(a)*d.d+Math.cos(t*d.s+d.ph)*.3;});
  ffGeo.attributes.position.needsUpdate=true;

  if(hq&&composer)composer.render(dt);else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
applySky();
requestAnimationFrame(frame);
})();
